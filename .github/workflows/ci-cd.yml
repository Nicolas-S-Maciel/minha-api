name: CI-CD FastAPI

on:
  push:
    branches: [main]

jobs:
  Build:
    name: 1 - Testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Rodar testes
        run: PYTHONPATH=. pytest tests/ -v

  Imagem:
    name: 2 - Enviar imagem ao Docker Hub
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:${{ github.sha }}

  Deploy:
    name: 3 - Atualizar a EC2
    runs-on: ubuntu-latest
    needs: Imagem
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            docker stop senai_fastapi || true
            docker rm senai_fastapi || true
            docker run -d --name senai_fastapi --restart unless-stopped -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/senai_fastapi:latest
            sleep 5
            curl -f http://localhost:8080/health
            docker image prune -f